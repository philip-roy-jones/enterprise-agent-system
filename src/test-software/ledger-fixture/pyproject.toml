[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ledger-fixture"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["enterprise-agent-contracts==0.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ledger_fixture*"]
namespaces = false

[tool.setuptools.package-data]
ledger_fixture = ["static/*"]
