[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-campaign-desk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34"]

[tool.setuptools.packages.find]
where = ["."]
include = ["campaign_desk*"]
namespaces = false

[project.scripts]
campaign-desk = "campaign_desk.app:main"
