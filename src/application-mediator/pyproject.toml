[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-application-mediator"
version = "0.1.0"
description = "A separately deployed, policy-enforced view of legacy applications"
requires-python = ">=3.11"
dependencies = ["enterprise-agent-contracts==0.1.0", "fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28", "python-dotenv>=1", "Pillow>=11,<13"]

[project.scripts]
enterprise-mediator = "eas_mediator.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eas_mediator*"]
namespaces = false
