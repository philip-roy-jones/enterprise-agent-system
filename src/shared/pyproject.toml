[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-contracts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["eas_shared*"]
namespaces = false
