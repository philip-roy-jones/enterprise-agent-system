[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-edge-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["enterprise-agent-contracts==0.1.0", "langgraph>=1.0", "langgraph-checkpoint-sqlite>=3.0", "deepagents>=0.4", "langchain-openrouter>=0.2,<1", "httpx>=0.28", "python-dotenv>=1", "PyJWT[crypto]>=2.12,<3"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["eas_harness*"]
namespaces = false

[project.scripts]
enterprise-harness = "eas_harness.cli:main"

[project.optional-dependencies]
browser = ["playwright>=1.50"]

[tool.setuptools.data-files]
"share/enterprise-agent-system/skills/invoice_correction" = ["skills/invoice_correction/manifest.json", "skills/invoice_correction/SKILL.md"]
