name: Prototype checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: ruff check src tools tests
      - run: ruff format --check src tools tests
      - run: mkdir -p runtime
      - run: pytest -q -x --basetemp=runtime/test-temp --junitxml=runtime/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            runtime/test-results.xml
            runtime/test-temp/integration*/worker.log
            runtime/test-temp/integration*/executor.log
            runtime/test-temp/integration*/backend.log
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project src/demobooks/AccountingSmoke/AccountingSmoke.csproj -c Release
      - run: dotnet publish src/demobooks/DemoBooks/DemoBooks.csproj -c Release -r win-x64 --self-contained true -o src/demobooks/publish
      - run: dotnet publish src/edge-harness/windows/DesktopAgent/DesktopAgent.csproj -c Release -r win-x64 --self-contained true -o src/edge-harness/windows/desktop-publish
      - uses: actions/upload-artifact@v4
        with:
          name: DemoBooks-Windows-x64
          path: src/demobooks/publish/
      - uses: actions/upload-artifact@v4
        with:
          name: Enterprise-DesktopAgent-Windows-x64
          path: src/edge-harness/windows/desktop-publish/

  standalone-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        component: [server, edge-harness]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -c requirements.lock ./src/shared ./src/${{ matrix.component }}
      - run: python -I tools/check_installation.py ${{ matrix.component }}
