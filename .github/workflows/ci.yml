name: Prototype checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - run: python -m playwright install --with-deps chromium
      - run: ruff check enterprise tests
      - run: ruff format --check enterprise tests
      - run: pytest -q --junitxml=runtime/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: runtime/test-results.xml
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project windows/AccountingSmoke/AccountingSmoke.csproj -c Release
      - run: dotnet publish windows/DemoBooks/DemoBooks.csproj -c Release -r win-x64 --self-contained true -o windows/publish
      - uses: actions/upload-artifact@v4
        with:
          name: DemoBooks-Windows-x64
          path: windows/publish/
