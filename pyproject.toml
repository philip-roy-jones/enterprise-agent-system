[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-system-dev"
version = "0.1.0"
description = "Development tools for supervised digital workers and automatic skill learning"
requires-python = ">=3.11"
dependencies = ["enterprise-agent-server==0.1.0", "enterprise-edge-harness[browser]==0.1.0", "httpx>=0.28"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
enterprise = "enterprise_dev.cli:main"

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: requires a Chromium installation"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["tools"]
include = ["enterprise_dev*"]
namespaces = false
